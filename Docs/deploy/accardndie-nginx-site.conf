server {

    server_name accardndie.com www.accardndie.com 217-160-212-85.sslip.io;

    root /var/www/html;
    index index.html index.htm;

location /admin { proxy_pass http://127.0.0.1:5017; }

    location /auth/ {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cancellazione account (https://accardndie.com/account/delete).
    # Pagina pubblica servita dal server .NET: Google Play la esige raggiungibile
    # dal web per le app con registrazione, e l'URL e' dichiarato in "Sicurezza
    # dei dati". Si appoggia al broker OAuth, quindi vale anche qui la env var
    # ACCARDND_GOOGLE_CLIENT_SECRET.
    location /account/ {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Informativa privacy: la pagina e' il file statico /var/www/html/privacy.html.
    # Google Play segue i redirect ma rifiuta un 404, e l'URL dichiarato in
    # "Contenuti dell'app" e' senza estensione.
    location = /privacy {
        return 301 /privacy.html;
    }

    # Statistiche del giocatore (https://accardndie.com/statistiche): pagina
    # generata dal server .NET, dietro accesso Google e in sola lettura. Il resto
    # del sito e' statico, ma questa legge dal database. Si appoggia al broker
    # OAuth, quindi vale anche qui la env var ACCARDND_GOOGLE_CLIENT_SECRET.
    location /statistiche {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Il gioco WebGL vive in /var/www/html/game/. Chi digita l'indirizzo senza la
    # barra finale va rimandato, altrimenti i percorsi relativi della pagina
    # (Build/, TemplateData/) verrebbero risolti dalla radice.
    location = /game {
        return 301 /game/;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5017;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:5017/ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/accardndie.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/accardndie.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.accardndie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = accardndie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name accardndie.com www.accardndie.com 217-160-212-85.sslip.io;
    return 404; # managed by Certbot

}
