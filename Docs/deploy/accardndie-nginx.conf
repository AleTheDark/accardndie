# AcCardNDie - configurazione cache per accardndie.com servito da nginx.
# VPS IONOS 217.160.212.85, web root /var/www/html.
#
# Come applicarla:
#   1. Copiare questi blocchi DENTRO il "server { ... }" di
#      /etc/nginx/sites-available/default (o creare un include).
#   2. sudo nginx -t                # verifica sintassi
#   3. sudo systemctl reload nginx  # applica senza downtime
#
# STRUTTURA DEL SITO (cambiata: prima il gioco stava in radice)
#   /            -> homepage statica (Docs/web/index.html)
#   /game/       -> la build WebGL: Build/, TemplateData/, StreamingAssets/, sw.js, manifest
#   /statistiche -> pagina generata dal server .NET (login Google, sola lettura)
#   /admin, /auth/, /account/, /ws, /health -> server .NET su :5017
#   /ads.txt, /oauth2redirect/ -> restano in RADICE: sono indirizzi che AdSense e
#       Google Cloud Console hanno registrato, spostarli li rompe.
#
# Logica della cache:
#   - HTML, sw.js e manifest -> mai cache "dura": gli aggiornamenti si vedono
#     subito e il Service Worker si aggiorna appena cambi la build.
#   - /game/Build/*  -> cache lunghissima "immutable": gli URL sono gia' versionati
#     con ?v=<Product Version>, quindi cambiano da soli quando pubblichi una
#     nuova build. ATTENZIONE: perche' i client vedano la nuova build DEVI
#     alzare la Product Version in Unity (Player Settings), altrimenti restano
#     sulla versione in cache.
#   - /game/StreamingAssets/  -> cache media con rivalidazione.

# WASM col MIME corretto (necessario per lo streaming compilation)
types { application/wasm wasm; }

# Compressione al volo: riduce il PRIMO download (Unity compression e' disattivata).
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/wasm application/octet-stream application/javascript text/javascript application/json image/svg+xml text/css;

# --- HTML: sempre rivalidato ---
location = / {
    add_header Cache-Control "no-cache";
}
location = /index.html {
    add_header Cache-Control "no-cache";
}
location = /game/ {
    add_header Cache-Control "no-cache";
}
location = /game/index.html {
    add_header Cache-Control "no-cache";
}

# --- Service Worker del gioco e manifest: mai in cache dura ---
location = /game/sw.js {
    add_header Cache-Control "no-cache";
}
location = /game/manifest.webmanifest {
    add_header Cache-Control "no-cache";
    types { application/manifest+json webmanifest; }
    default_type application/manifest+json;
}

# --- Service Worker "lapide" della radice ---
# Non e' un doppione: e' il file che disinstalla il vecchio Service Worker dei
# browser che hanno visitato il sito quando il gioco stava in radice. Deve poter
# essere riscaricato subito, altrimenti quei browser restano con la vecchia
# registrazione viva. Vedi Docs/web/sw.js.
location = /sw.js {
    add_header Cache-Control "no-cache";
}

# --- File pesanti della build: versionati con ?v=, cache immutabile ---
location /game/Build/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# --- Asset del template (loader gia' versionato a parte via ?v=) ---
location /game/TemplateData/ {
    add_header Cache-Control "public, max-age=604800";
}

# --- StreamingAssets: rivalidazione ---
location /game/StreamingAssets/ {
    add_header Cache-Control "public, max-age=0, must-revalidate";
}

# --- Immagini, video e font del sito: cambiano di rado ---
location /media/ {
    add_header Cache-Control "public, max-age=604800";
}
location /fonts/ {
    add_header Cache-Control "public, max-age=2592000";
}

# --- /game senza barra finale ---
# Senza questo, chi digita accardndie.com/game prende un 301 generato da nginx che
# in alcune configurazioni dietro proxy perde lo schema https. Meglio dirlo qui.
location = /game {
    return 301 /game/;
}

# --- Informativa privacy (https://accardndie.com/privacy) ---
# La pagina e' un file statico in /var/www/html/privacy.html. Google Play verifica
# l'URL dichiarato in "Contenuti dell'app" seguendo i redirect, ma risponde 404 se
# l'URL non esiste: senza questo blocco, /privacy (senza estensione) cade e la
# scheda viene rifiutata anche se /privacy.html funziona benissimo. Un redirect
# invece di un alias, cosi' resta un solo URL canonico.
location = /privacy {
    return 301 /privacy.html;
}

# --- Pagina delle statistiche, servita dal server .NET su :5017 ---
# Sola lettura, dietro accesso Google. Sta sul server .NET e non fra i file
# statici perche' i numeri vengono dal database. Niente cache: e' una pagina
# personale, e la risposta lo dichiara gia' con Cache-Control: no-store.
location /statistiche {
    proxy_pass http://127.0.0.1:5017;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Pannello admin: pagina + API, servite dal server .NET su :5017 ---
# Come il blocco /ws, ma HTTP normale (niente upgrade WebSocket).
# Il server risponde 404 su tutto /admin se non e configurata la password
# admin (env var ACCARDND_ADMIN_PASSWORD nel servizio .NET).
location /admin {
    proxy_pass http://127.0.0.1:5017;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Broker OAuth Google per l'APK Android, servito dal server .NET su :5017 ---
# /auth/google/callback e' l'URI di reindirizzamento registrato sul client OAuth
# Web in Google Cloud Console: senza questo blocco Google atterra su nginx e
# l'app resta in attesa. Serve anche la env var ACCARDND_GOOGLE_CLIENT_SECRET
# nel servizio .NET, altrimenti il broker resta spento.
location /auth/ {
    proxy_pass http://127.0.0.1:5017;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Cancellazione account (https://accardndie.com/account/delete) ---
# Pagina pubblica servita dal server .NET. Google Play la esige raggiungibile dal
# web per le app con registrazione, e l'URL e' dichiarato in "Sicurezza dei dati":
# senza questo blocco nginx risponde 404 dai file statici e la scheda viene
# rifiutata. La pagina si appoggia al broker OAuth, quindi vale anche qui la
# env var ACCARDND_GOOGLE_CLIENT_SECRET.
location /account/ {
    proxy_pass http://127.0.0.1:5017;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
