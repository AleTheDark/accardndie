# QUESTA e' la configurazione DAVVERO servita da accardndie.com.
#
# Fotografata dal server il 2026-08-17, dopo averla ricostruita: un sed con
# intervallo /^}/ lanciato su un file mai letto aveva cancellato meta' del blocco
# server. Vedi Docs/deploy/accardndie-nginx.conf, che descrive invece una
# configurazione PIU' RICCA mai applicata: non usarlo come riferimento di cio' che
# gira.
#
# Sul VPS sta in /etc/nginx/sites-available/default, e
# /etc/nginx/sites-enabled/default e' un LINK SIMBOLICO che punta li'. Prima erano
# due file distinti con lo stesso nome: e' la ragione per cui e' facile modificare
# quello sbagliato. Se tornassero due, ricreare il link.
#
# Applicazione:
#   cat > /etc/nginx/sites-available/default <<'FINE'   (incollare, poi FINE)
#   nginx -t && systemctl reload nginx
#
# Verifica, l'handshake WebSocket e' quello che si dimentica:
#   curl -sI https://accardndie.com/guida | head -1
#   curl -s -i -N -H "Connection: Upgrade" -H "Upgrade: websocket" #     -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: x3JJHMbDL1EzLkh9GBhXDw==" #     https://accardndie.com/ws | head -1        # deve dire 101

server {

    server_name accardndie.com www.accardndie.com 217-160-212-85.sslip.io;

    root /var/www/html;
    index index.html index.htm;

    # Indirizzi senza .html: /guida serve guida.html. I file sul disco restano
    # .html, cambia solo come si raggiungono. $uri per primo, cosi' immagini e
    # font non passano dal tentativo con estensione.
    #
    # ORDINE DEL DEPLOY: le pagine hanno i link interni gia' senza estensione,
    # quindi questa riga va applicata PRIMA di pubblicare l'HTML nuovo.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /admin { proxy_pass http://127.0.0.1:5017; }

    location /auth/ {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cancellazione account: Google Play la esige raggiungibile dal web.
    location /account/ {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Esatta e non prefisso: /health e' un endpoint solo.
    location = /health {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Pagine generate dal server .NET: i numeri vengono dal database.
    location /statistiche {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hall-of-fame {
        proxy_pass http://127.0.0.1:5017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket del PvP. Il timeout di 24 ore non e' esagerato: una partita puo'
    # restare ferma a lungo, e col minuto di default nginx la chiude a meta'.
    location /ws {
        proxy_pass http://127.0.0.1:5017/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/accardndie.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/accardndie.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.accardndie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = accardndie.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name accardndie.com www.accardndie.com 217-160-212-85.sslip.io;
    return 404; # managed by Certbot

}
